[project]
name = "backend"
version = "0.1.0"
description = "Shop AI backend"
readme = "README.md"
authors = [
    { name = "Fahim sahriar", email = "fahimsahriar2002@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
ignore = ["B008"]
